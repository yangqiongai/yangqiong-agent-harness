server:
  port: 8080

ai:
  harness:
    model:
      enabled: true
      default-provider: openai
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model-name: ${OPENAI_MODEL:gpt-4o-mini}
    runtime:
      enabled: true
      name: spring-boot-agent
      system-prompt: 你是一个智能助手，请用中文回答。
      max-iters: 10
    store:
      # memory | jdbc | redis（jdbc/redis 需额外引入扩展模块并自定义 DistributedStores Bean）
      type: memory
    tracing:
      enabled: true
